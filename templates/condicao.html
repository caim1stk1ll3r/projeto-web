<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{chave}}</title>
</head>
<body>
    <h1>{{valor}}</h1>

    {% if valor == 0 %}
        <p>O número enviado é PAR!</p>

    {% elif (valor % 2 == 0) %}
        <p>O número enviado é ZERO, não divide!</p>

    {% else %}
        <p>O número enviado é ÌMPAR!</p>
    {% endif %}

    <br> <h1>Contando até 0</h1>
    <ul>
    {% for i in range(valor, -1, -1) %}
        <li>{{i}}</li>
        {% endfor %}
    </ul>

</body>
</html>
